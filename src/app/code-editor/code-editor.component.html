<div class="editor-page">

  <div class="editor-header">
    <span class="title">⚡ Online .NET Code Editor</span>
    <div class ="header-buttons">
      <button class="mode-btn" (click)="toggleMode()">{{ isDarkMode ? '🌙 Dark' : '☀️ Light' }}</button>
      <button class="run-btn" (click)="runCode()">▶ Run</button>
    </div>
  </div>

  <div class="editor-main">
    <div class="file-tabs">
      <ng-container *ngFor="let file of files; let i = index">
        <span class="file-tab" [class.active]="i === selectedFileIndex" (click)="selectFile(i)">
          <ng-container *ngIf="i === selectedFileIndex; else fileNameDisplay">
            <input class="file-rename-input" [(ngModel)]="file.fileName" (click)="$event.stopPropagation()" />
          </ng-container>
          <ng-template #fileNameDisplay>{{ file.fileName }}</ng-template>
          <button *ngIf="files.length > 1" class="close-btn" (click)="removeFile(i); $event.stopPropagation();">×</button>
        </span>
      </ng-container>
      <button class="add-file-btn" (click)="addFile()">＋</button>
    </div>
    <div class="editor-container" [style.height.px]="editorHeight">
      <div id="monaco-container"></div>
    </div>

    <div class="resizer"
     (mousedown)="maybeStartResizing($event)"
     (dblclick)="enableResizing()"></div>

    <div class="output-container" [style.height.px]="outputHeight">
      <div class="output-header">Console Output</div>

      <div class="input-container">
        <label>Input:</label>
        <input
          [(ngModel)]="userInput"
          placeholder="Enter input for Console.ReadLine()" />
      </div>

      <pre class="output">{{ output }}</pre>
    </div>
  </div>
</div>
